<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Writer Notepad</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: transparent;
    }

    .ios-shadow {
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .ai-gradient-icon {
      background: linear-gradient(135deg, #7dd3fc, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.5); }

    /* Tab strip */
    .tab-bar::-webkit-scrollbar { display: none; }

    /* Icon buttons (30x30, rounded 8px, hover fill) */
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      color: #71717a;
      background: transparent;
      transition: background 140ms ease, color 140ms ease;
    }
    .icon-button:hover { color: #f4f4f5; background: rgba(255, 255, 255, 0.08); }
    .icon-button.close:hover { color: #f87171; background: rgba(248, 113, 113, 0.12); }
    .icon-button .material-icons-outlined { font-size: 18px; }

    /* Light theme (follows unified appearance settings) */
    html:not(.dark) .icon-button:hover { color: #18181b; background: rgba(0, 0, 0, 0.06); }
    html:not(.dark) .icon-button.close:hover { color: #dc2626; background: rgba(220, 38, 38, 0.1); }
  </style>
</head>

<body class="bg-transparent text-zinc-200">

  <!-- Glass Shell -->
  <div
    class="notepad-shell flex h-full w-full flex-col glass-effect app-shell ios-shadow border border-black/10 dark:border-white/10 overflow-hidden"
    data-tauri-drag-region
  >

    <!-- Header / Drag Area -->
    <header
      class="shrink-0 flex items-center justify-between gap-2 h-11 px-3 border-b border-black/5 dark:border-white/10"
      data-tauri-drag-region
    >
      <div class="flex min-w-0 items-center gap-2">
        <span class="material-icons-outlined text-[18px] text-amber-400">edit_note</span>
        <h1 class="truncate text-sm font-bold tracking-wide text-zinc-800 dark:text-zinc-200">
          Notepad
        </h1>
        <span
          id="note-count"
          class="shrink-0 text-[10px] bg-amber-500/10 text-amber-500 dark:text-amber-400 px-2 py-0.5 rounded-full uppercase font-bold tracking-tight"
        >0 notes</span>
      </div>
      <div class="flex items-center gap-1" style="-webkit-app-region: no-drag;">
        <button onclick="npClose()" class="icon-button close" title="Close notepad" aria-label="Close notepad">
          <span class="material-icons-outlined">close</span>
        </button>
      </div>
    </header>

    <!-- Tab Strip -->
    <div class="shrink-0 flex items-center gap-1.5 px-3 pt-2 pb-1 min-w-0">
      <div
        id="tab-container"
        class="tab-bar flex items-center gap-1 overflow-x-auto overflow-y-hidden py-0.5 min-w-0 flex-1"
      ></div>
      <button
        onclick="npCreateNew()"
        title="New note"
        aria-label="New note"
        class="shrink-0 flex items-center justify-center w-6 h-6 rounded-lg text-zinc-500 hover:text-zinc-200 hover:bg-white/5 transition-all text-base leading-none"
      >+</button>
    </div>

    <!-- Main Area -->
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden relative px-3 pb-2">

      <!-- Empty State -->
      <div
        id="empty-state"
        class="flex-1 flex flex-col items-center justify-center gap-3 text-zinc-500"
      >
        <div class="flex items-center justify-center w-12 h-12 rounded-[15px] text-amber-400 bg-amber-500/10">
          <span class="material-icons-outlined text-[24px]">edit_note</span>
        </div>
        <p class="text-[13px] font-semibold text-zinc-400">No notes yet</p>
        <button
          onclick="npCreateNew()"
          class="flex items-center gap-1.5 rounded-xl bg-primary px-4 py-2 text-[11px] font-bold uppercase tracking-wide text-white transition-all hover:bg-primary/90"
        >
          <span class="material-icons-outlined text-[15px]">add</span>
          Create New Note
        </button>
      </div>

      <!-- Editor -->
      <div id="editor" class="hidden flex-1 flex flex-col min-h-0 overflow-hidden">
        <!-- Title row -->
        <div class="flex items-center gap-1.5 pt-1 pb-1 shrink-0">
          <input
            id="note-title"
            type="text"
            placeholder="Note Title..."
            oninput="npTitleInput()"
            class="flex-1 bg-transparent border-none focus:ring-0 p-0 text-[15px] font-bold text-zinc-800 dark:text-zinc-100 placeholder-zinc-500 min-w-0"
          />
          <button onclick="npCopy()" title="Copy content" class="icon-button">
            <span class="material-icons-outlined">content_copy</span>
          </button>
          <button onclick="npDelete()" title="Delete note" class="icon-button close">
            <span class="material-icons-outlined">delete</span>
          </button>
        </div>

        <!-- Meta row -->
        <div class="flex items-center justify-between gap-2 text-[10px] text-zinc-500 pb-1.5 mb-1 border-b border-black/5 dark:border-white/10 shrink-0">
          <span id="note-date">Last modified: -</span>
          <span id="save-indicator" class="text-zinc-500 opacity-0 transition-opacity">Saved</span>
        </div>

        <!-- Textarea -->
        <div class="flex-1 min-h-0 overflow-y-auto py-1">
          <textarea
            id="note-content"
            placeholder="Type your notes here..."
            oninput="npContentInput()"
            class="w-full h-full bg-transparent border-none focus:ring-0 p-0 text-[13px] text-zinc-800 dark:text-zinc-200 placeholder-zinc-600 resize-none leading-relaxed"
          ></textarea>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <footer class="shrink-0 px-4 py-2.5 border-t border-black/5 dark:border-white/10">
      <p class="text-center text-[10px] leading-relaxed text-zinc-500">
        Notes are stored locally and never sent to an AI provider.
      </p>
    </footer>
  </div>

  <!-- Toast -->
  <div
    id="toast"
    class="hidden fixed bottom-3 left-3 right-3 z-[9999]"
  >
    <div class="glass-effect bg-black/80 dark:bg-zinc-900/90 text-white rounded-2xl p-3 flex items-center gap-3 shadow-2xl border border-white/10">
      <span class="material-icons-outlined text-amber-400 text-[16px]">check_circle</span>
      <span id="toast-msg" class="text-sm font-medium flex-1"></span>
    </div>
  </div>

<script>
'use strict';
const STORE_KEY = 'ghost_writer_notepad_v2';
const LEGACY_STORE_KEY = 'luminus_notepad_v2';
let notes = [];
let activeId = null;
let saveTimer = null;
let editingTabId = null;

// ── Close via Tauri ──
function npClose() {
  try {
    if (window.__TAURI__ && window.__TAURI__.window) {
      window.__TAURI__.window.getCurrentWindow().hide();
    } else if (window.__TAURI__ && window.__TAURI__.core) {
      window.__TAURI__.core.invoke('close_notepad_window').catch(() => window.close());
    } else {
      window.close();
    }
  } catch(e) { window.close(); }
}

function npSetCount() {
  const el = document.getElementById('note-count');
  if (!el) return;
  el.textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
}

// ── Storage ──
function load() {
  try {
    const currentRaw = localStorage.getItem(STORE_KEY);
    const legacyRaw = currentRaw ? null : localStorage.getItem(LEGACY_STORE_KEY);
    notes = JSON.parse(currentRaw || legacyRaw || '[]');
    if (legacyRaw) {
      localStorage.setItem(STORE_KEY, legacyRaw);
      localStorage.removeItem(LEGACY_STORE_KEY);
    }
  } catch(e) { notes = []; }
  if (notes.length === 0) {
    notes.push({
      id: 'note_' + Date.now(),
      title: 'Welcome',
      content: 'Your notes live here — each note is a tab.\n\n• Create new notes with the + button\n• Close tabs with the × on each tab\n• Double-click a tab to rename it\n• Notes auto-save locally',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
    save();
  }
  renderTabs();
  if (notes.length > 0) select(notes[0].id);
  else showEmpty(true);
}

function save() {
  const latest = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  for (const item of latest) {
    if (!notes.some(note => note.id === item.id)) notes.push(item);
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(notes));
}

// ── Rendering Tabs ──
function renderTabs() {
  const container = document.getElementById('tab-container');
  if (container) {
    container.innerHTML = '';
    notes.forEach(n => {
      const tab = document.createElement('div');
      tab.className =
        'tab flex items-center gap-1.5 h-[24px] px-2.5 max-w-[160px] cursor-pointer text-[11px] rounded-full shrink-0 transition-all overflow-hidden' +
        (n.id === activeId
          ? ' bg-black/5 text-zinc-800 shadow-sm dark:bg-white/15 dark:text-zinc-100'
          : ' text-zinc-500 hover:text-zinc-700 hover:bg-black/5 dark:hover:text-zinc-300 dark:hover:bg-white/[0.04]');
      tab.dataset.id = n.id;

      const title = document.createElement('span');
      title.className = 'tab-title overflow-hidden text-ellipsis whitespace-nowrap min-w-0 flex-1';
      title.textContent = n.title || 'Untitled';

      const close = document.createElement('span');
      close.className =
        'tab-close flex items-center justify-center w-3.5 h-3.5 rounded-full text-[10px] text-zinc-600 opacity-0 transition-all shrink-0 leading-none' +
        (n.id === activeId ? ' opacity-50' : '');
      close.textContent = '\u00D7';
      close.onmouseenter = () => { close.style.background = 'rgba(255,255,255,0.08)'; close.style.color = '#e4e4e7'; };
      close.onmouseleave = () => { close.style.background = 'transparent'; close.style.color = ''; };
      close.onclick = (e) => { e.stopPropagation(); npDeleteTab(n.id); };

      tab.appendChild(title);
      tab.appendChild(close);
      tab.onclick = () => select(n.id);
      tab.ondblclick = () => startRenameTab(n.id);

      container.appendChild(tab);
    });
  }
  npSetCount();
  save();
}

function startRenameTab(id) {
  const tab = document.querySelector(`.tab[data-id="${id}"]`);
  if (!tab) return;
  const titleEl = tab.querySelector('.tab-title');
  const current = titleEl.textContent;
  const input = document.createElement('input');
  input.className = 'tab-title-input bg-transparent border-none text-zinc-100 text-[11px] outline-none w-full min-w-[40px] px-0';
  input.value = current;
  input.onblur = () => finishRenameTab(id, input.value);
  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  };
  titleEl.replaceWith(input);
  editingTabId = id;
  setTimeout(() => { input.focus(); input.select(); }, 10);
}

function finishRenameTab(id, value) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.title = value.trim() || 'Untitled';
  note.updatedAt = new Date().toISOString();
  editingTabId = null;
  save();
  renderTabs();
  if (id === activeId) {
    document.getElementById('note-title').value = note.title;
  }
}

// ── Select tab ──
function select(id) {
  activeId = id;
  const note = notes.find(n => n.id === id);
  renderTabs();
  if (!note) { showEmpty(true); return; }
  showEmpty(false);
  document.getElementById('note-title').value = note.title || '';
  document.getElementById('note-content').value = note.content || '';
  const dateEl = document.getElementById('note-date');
  if (dateEl) dateEl.textContent = 'Last modified: ' + fmtDate(note.updatedAt);
  setTimeout(() => document.getElementById('note-content').focus(), 50);
}

function showEmpty(yes) {
  document.getElementById('empty-state').style.display = yes ? 'flex' : 'none';
  document.getElementById('editor').classList.toggle('hidden', yes);
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
}

// ── Actions ──
function npCreateNew() {
  const n = {
    id: 'note_' + Date.now(),
    title: 'New Note',
    content: '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  notes.unshift(n);
  save();
  select(n.id);
  toast('Note created');
}

function npDeleteTab(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (notes.length <= 1) {
    note.title = 'Untitled';
    note.content = '';
    note.updatedAt = new Date().toISOString();
    save();
    renderTabs();
    if (activeId === id) {
      document.getElementById('note-title').value = note.title;
      document.getElementById('note-content').value = note.content;
    }
    toast('Cleared');
    return;
  }
  notes = notes.filter(n => n.id !== id);
  localStorage.setItem(STORE_KEY, JSON.stringify(notes));
  save();
  if (id === activeId) {
    if (notes.length > 0) select(notes[0].id);
    else showEmpty(true);
  } else {
    renderTabs();
  }
  toast('Deleted');
}

function npTitleInput() {
  const note = notes.find(n => n.id === activeId);
  if (!note) return;
  note.title = document.getElementById('note-title').value;
  note.updatedAt = new Date().toISOString();
  autoSave();
}

function npContentInput() {
  const note = notes.find(n => n.id === activeId);
  if (!note) return;
  note.content = document.getElementById('note-content').value;
  note.updatedAt = new Date().toISOString();
  autoSave();
}

function autoSave() {
  const ind = document.getElementById('save-indicator');
  if (ind) { ind.textContent = 'Saving...'; ind.style.opacity = '1'; }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    save();
    renderTabs();
    if (ind) { ind.textContent = 'Saved'; setTimeout(() => { ind.style.opacity = '0'; }, 1200); }
  }, 400);
}

function npDelete() {
  if (!activeId) return;
  npDeleteTab(activeId);
}

async function npCopy() {
  const note = notes.find(n => n.id === activeId);
  if (!note) return;
  const c = document.getElementById('note-content').value;
  if (!c) return;
  try {
    await window.__TAURI__.core.invoke('write_to_clipboard', { text: c });
    toast('Copied!');
  } catch (_) {
    try { await navigator.clipboard.writeText(c); toast('Copied!'); }
    catch (_) { toast('Could not copy'); }
  }
}

window.addEventListener('storage', (event) => {
  if (event.key === STORE_KEY) {
    const incoming = JSON.parse(event.newValue || '[]');
    if (saveTimer) {
      const edited = notes.find(n => n.id === activeId);
      const idx = incoming.findIndex(n => n.id === activeId);
      if (edited && idx >= 0 && edited.updatedAt > incoming[idx].updatedAt) incoming[idx] = edited;
      clearTimeout(saveTimer);
      saveTimer = null;
      localStorage.setItem(STORE_KEY, JSON.stringify(incoming));
    }
    notes = incoming;
    renderTabs();
    if (notes.length) select(notes[0].id); else showEmpty(true);
  }
});

function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  document.getElementById('toast-msg').textContent = msg;
  el.classList.remove('hidden');
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 300); }, 2000);
}

// ── Window drag (like clipboard) ──
const currentWindow = window.__TAURI__?.window?.getCurrentWindow?.();
function startWindowDrag(event) {
  if (event.button !== 0) return;
  if (event.target.closest('button, input, textarea, .tab-bar, [data-tauri-drag-region="no-drag"]')) return;
  const dragResult = currentWindow?.startDragging?.();
  if (dragResult && typeof dragResult.catch === 'function') {
    dragResult.catch(() => {});
  }
}
document.querySelectorAll('.notepad-shell, header[data-tauri-drag-region]').forEach((region) => {
  region.addEventListener('mousedown', startWindowDrag);
});

// ── Boot ──
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  load();
} else {
  document.addEventListener('DOMContentLoaded', load);
}
</script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
