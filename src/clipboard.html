<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Writer Clipboard</title>
    <script src="appearance.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --panel: rgba(28, 28, 30, 0.8);
        --panel-raised: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.1);
        --primary: #007aff;
        --primary-dim: rgba(0, 122, 255, 0.14);
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --dim: #71717a;
        --faint: #52525b;
        --amber: #fbbf24;
        --red: #f87171;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .clipboard-shell {
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      .app-layout {
        display: flex;
        min-height: 0;
        flex: 1;
      }

      .workspace {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
      }

      .window-drag {
        width: 100%;
        height: 4px;
        flex-shrink: 0;
        cursor: grab;
        -webkit-app-region: drag;
      }

      button, input { font: inherit; }
      button { cursor: pointer; }

      .material-icons-outlined {
        font-size: 18px;
        line-height: 1;
        vertical-align: middle;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 48px;
        padding: 0 14px;
        flex-shrink: 0;
        background: transparent;
        border-bottom: 0;
        -webkit-app-region: drag;
      }

      .title-group, .header-actions, .toolbar-row, .item-actions {
        display: flex;
        align-items: center;
      }

      .title-group { min-width: 0; gap: 9px; }
      .title-icon {
        background: linear-gradient(135deg, #7dd3fc, #c084fc, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .title { font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
      .header-actions { gap: 3px; }
      .view-toggle {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        -webkit-app-region: no-drag;
      }
      .view-button {
        min-width: 50px;
        padding: 5px 8px;
        border: 0;
        border-radius: 9px;
        color: var(--dim);
        background: transparent;
        font-size: 10px;
        font-weight: 650;
        transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease;
        -webkit-app-region: no-drag;
      }
      .view-button:hover { color: var(--text); }
      .view-button.active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.13);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      }
      .icon-button, .item-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        color: var(--dim);
        background: transparent;
        border-radius: 8px;
        transition: background 140ms ease, color 140ms ease;
      }
      .icon-button { width: 30px; height: 30px; }
      .icon-button:hover { color: var(--text); background: var(--panel-raised); }
      .icon-button.close:hover { color: var(--red); background: rgba(248, 113, 113, 0.12); }
      .icon-button, .primary-button, .search, .clip-item { -webkit-app-region: no-drag; }

      .toolbar {
        padding: 4px 14px 10px;
        flex-shrink: 0;
        border-bottom: 0;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid rgba(63, 63, 70, 0.3);
        border-radius: 10px;
        background: rgba(39, 39, 42, 0.4);
      }
      .search:focus-within { border-color: rgba(0, 122, 255, 0.58); }
      .search .material-icons-outlined { color: var(--faint); font-size: 17px; }
      .search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: var(--text);
        background: transparent;
        font-size: 12px;
      }
      .search input::placeholder { color: var(--faint); }

      .toolbar-row {
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }
      .status { color: var(--dim); font-size: 11px; }
      .primary-button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 10px;
        border: 1px solid rgba(0, 122, 255, 0.8);
        border-radius: 8px;
        color: #ffffff;
        background: var(--primary);
        box-shadow: 0 4px 14px rgba(0, 122, 255, 0.22);
        font-size: 11px;
        font-weight: 650;
      }
      .primary-button:hover { background: #006ee6; }
      .primary-button .material-icons-outlined { color: #ffffff; font-size: 15px; }

      .history {
        flex: 1;
        overflow-y: auto;
        padding: 4px 14px 16px;
      }
      .history::-webkit-scrollbar { width: 6px; }
      .history::-webkit-scrollbar-track { background: transparent; }
      .history::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 999px; }

      .empty {
        display: flex;
        min-height: 270px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        padding: 24px;
        text-align: center;
      }
      .empty-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-bottom: 3px;
        border-radius: 15px;
        color: var(--faint);
        background: rgba(255, 255, 255, 0.06);
      }
      .empty-icon .material-icons-outlined { font-size: 24px; }
      .empty-title { color: var(--muted); font-size: 13px; font-weight: 600; }
      .empty-copy { max-width: 250px; color: var(--faint); font-size: 11px; line-height: 1.5; }

      .clip-item {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        margin-bottom: 5px;
        padding: 9px 0;
        border: 0;
        border-radius: 0;
        color: var(--text);
        text-align: left;
        background: transparent;
        cursor: pointer;
        transition: color 140ms ease;
      }
      .timeline {
        padding: 4px 0 10px;
      }
      .timeline-group {
        position: relative;
        margin-bottom: 18px;
      }
      .timeline-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 0 8px 9px;
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
      }
      .timeline-heading .timeline-dot {
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        border: 2px solid rgba(161, 161, 170, 0.65);
        border-radius: 999px;
        background: var(--panel);
      }
      .timeline-items {
        position: relative;
        margin-left: 13px;
        padding-left: 15px;
        border-left: 1px solid rgba(255, 255, 255, 0.12);
      }
      .timeline-items .clip-item::before {
        position: absolute;
        top: 15px;
        left: -20px;
        width: 8px;
        height: 8px;
        border: 2px solid rgba(161, 161, 170, 0.68);
        border-radius: 999px;
        background: var(--panel);
        content: "";
      }
      .timeline-items .clip-item.selected {
        border-color: transparent;
        background: transparent;
        box-shadow: none;
      }
      .timeline-items .clip-item.selected::before {
        border-color: rgba(244, 114, 182, 0.95);
        background: #f472b6;
        box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.12), 0 0 12px rgba(244, 114, 182, 0.45);
      }
      .timeline-items .clip-item:last-child { margin-bottom: 0; }
      .clip-item:hover {
        background: transparent;
      }
      .clip-item:hover .clip-text,
      .clip-item.selected .clip-text { color: #ffffff; }
      .clip-main { min-width: 0; flex: 1; }
      .clip-text {
        display: -webkit-box;
        overflow: hidden;
        color: #e4e4e7;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }
      .clip-meta {
        display: flex;
        gap: 7px;
        margin-top: 7px;
        color: var(--faint);
        font-size: 10px;
      }
      .item-actions { align-self: stretch; gap: 1px; }
      .item-button { width: 26px; height: 26px; }
      .item-button:hover { color: #60a5fa; background: rgba(0, 122, 255, 0.12); }
      .item-button.pin-active { color: var(--amber); }
      .item-button.danger:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }
      .item-button .material-icons-outlined { font-size: 16px; }

      .footer {
        flex-shrink: 0;
        padding: 9px 13px 11px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--faint);
        font-size: 10px;
        line-height: 1.4;
        text-align: center;
      }

      .toast {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 5;
        padding: 8px 11px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.8);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
        font-size: 11px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(5px);
        transition: opacity 160ms ease, transform 160ms ease;
      }
      .toast.show { opacity: 1; transform: translateY(0); }

      /* ── Light theme (follows unified appearance settings) ── */
      html:not(.dark) {
        color-scheme: light;
        --bg: #ffffff;
        --panel: rgba(242, 242, 247, 0.9);
        --panel-raised: rgba(0, 0, 0, 0.06);
        --border: rgba(0, 0, 0, 0.12);
        --text: #18181b;
        --muted: #3f3f46;
        --dim: #52525b;
        --faint: #71717a;
        --amber: #d97706;
        --red: #dc2626;
      }
      html:not(.dark) .clipboard-shell { border-color: var(--border); }
      html:not(.dark) .view-toggle { border-color: rgba(0, 0, 0, 0.1); background: rgba(0, 0, 0, 0.04); }
      html:not(.dark) .view-button.active { background: rgba(0, 0, 0, 0.09); }
      html:not(.dark) .search { border-color: rgba(0, 0, 0, 0.14); background: rgba(255, 255, 255, 0.6); }
      html:not(.dark) .search:focus-within { border-color: rgba(0, 122, 255, 0.6); }
      html:not(.dark) .footer { border-top-color: rgba(0, 0, 0, 0.06); }
      html:not(.dark) .timeline-items { border-left-color: rgba(0, 0, 0, 0.12); }
      html:not(.dark) .clip-text { color: #3f3f46; }
      html:not(.dark) .clip-item:hover .clip-text,
      html:not(.dark) .clip-item.selected .clip-text { color: #18181b; }
      html:not(.dark) .empty-icon { background: rgba(0, 0, 0, 0.05); }
      html:not(.dark) .toast { border-color: var(--border); }
    </style>
  </head>
  <body>
    <div class="clipboard-shell glass-effect app-shell" data-tauri-drag-region>
      <div class="window-drag" data-tauri-drag-region></div>
      <div class="app-layout">
        <div class="workspace">
          <header class="header">
            <div class="title-group">
              <span class="material-icons-outlined title-icon">content_paste</span>
              <span class="title">Clipboard</span>
            </div>
            <div class="header-actions">
              <div class="view-toggle" role="tablist" aria-label="Clipboard history views">
                <button class="view-button active" data-history-view="all" role="tab" aria-selected="true">All</button>
                <button class="view-button" data-history-view="pinned" role="tab" aria-selected="false">Pinned</button>
              </div>
              <button class="icon-button close" id="close-button" title="Close clipboard" aria-label="Close clipboard">
                <span class="material-icons-outlined">close</span>
              </button>
            </div>
          </header>

          <section class="toolbar">
            <label class="search">
              <span class="material-icons-outlined">search</span>
              <input id="search-input" type="search" autocomplete="off" placeholder="Search clipboard history" />
            </label>
            <div class="toolbar-row">
              <span class="status" id="status">0 items</span>
            </div>
          </section>

          <main class="history" id="history" aria-live="polite"></main>

          <footer class="footer">
            Clipboard history is managed in Preferences and stays local to this device.
          </footer>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
      "use strict";

      const invoke = window.__TAURI__?.core?.invoke || (async () => {
        throw new Error("Tauri is unavailable");
      });
      const listen = window.__TAURI__?.event?.listen || (async () => () => {});
      const HISTORY_KEY = "ghost_writer_clipboard_history_v1";
      const SETTINGS_KEY = "ghost_writer_clipboard_settings_v1";
      const DEFAULT_SETTINGS = { autoCapture: true, maxItems: 50 };
      const MAX_TEXT_LENGTH = 250000;

      let items = [];
      let clipboardSettings = loadClipboardSettings();
      let lastClipboard = null;
      let pollInFlight = false;
      let toastTimer = null;
      let historyView = "all";
      let activeItemId = null;

      function makeId() {
        if (crypto.randomUUID) return crypto.randomUUID();
        return `clip_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      }

      function loadClipboardSettings() {
        try {
          const stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
          const maxItems = Number(stored.maxItems);
          return {
            autoCapture: stored.autoCapture !== false,
            maxItems: [25, 50, 100, 200].includes(maxItems) ? maxItems : DEFAULT_SETTINGS.maxItems,
          };
        } catch (_) {
          return { ...DEFAULT_SETTINGS };
        }
      }

      function saveItems() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(items));
      }

      function loadItems() {
        try {
          const stored = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          items = Array.isArray(stored)
            ? stored.filter((item) => item && typeof item.text === "string").map((item) => ({
                id: String(item.id || makeId()),
                text: item.text.startsWith("data:image/png;base64,") ? item.text : item.text.slice(0, MAX_TEXT_LENGTH),
                pinned: Boolean(item.pinned),
                createdAt: Number(item.createdAt) || Date.now(),
              }))
            : [];
        } catch (_) {
          items = [];
        }
        sortItems();
      }

      function sortItems() {
        items.sort((a, b) => Number(b.pinned) - Number(a.pinned) || b.createdAt - a.createdAt);
      }

      function trimItems() {
        sortItems();
        while (items.length > clipboardSettings.maxItems) {
          const removableIndex = items.findLastIndex((item) => !item.pinned);
          if (removableIndex < 0) break;
          items.splice(removableIndex, 1);
        }
      }

      function addItem(text) {
        if (typeof text !== "string" || !text.trim() || text.length > MAX_TEXT_LENGTH) return;
        const existing = items.find((item) => item.text === text);
        if (existing) {
          existing.createdAt = Date.now();
        } else {
          items.push({ id: makeId(), text, pinned: false, createdAt: Date.now() });
        }
        trimItems();
        saveItems();
        render();
      }

      function formatTime(timestamp) {
        const date = new Date(timestamp);
        const today = new Date();
        if (date.toDateString() === today.toDateString()) {
          return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }
        return date.toLocaleDateString([], { month: "short", day: "numeric" });
      }

      function formatLength(text) {
        return `${text.length.toLocaleString()} ${text.length === 1 ? "character" : "characters"}`;
      }

      function historyGroupLabel(timestamp) {
        const date = new Date(timestamp);
        const today = new Date();
        const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const startDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const dayDifference = Math.round((startToday - startDate) / 86400000);

        if (dayDifference === 0) return "Today";
        if (dayDifference === 1) return "Yesterday";
        return date.toLocaleDateString([], {
          month: "short",
          day: "numeric",
          year: date.getFullYear() === today.getFullYear() ? undefined : "numeric",
        });
      }

      function updateHistoryViewControls() {
        document.querySelectorAll("[data-history-view]").forEach((button) => {
          const isActive = button.dataset.historyView === historyView;
          button.classList.toggle("active", isActive);
          if (button.getAttribute("role") === "tab") {
            button.setAttribute("aria-selected", String(isActive));
          }
        });
      }

      function setHistoryView(view) {
        historyView = view === "pinned" ? "pinned" : "all";
        updateHistoryViewControls();
        render();
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function makeIcon(name) {
        const icon = document.createElement("span");
        icon.className = "material-icons-outlined";
        icon.textContent = name;
        return icon;
      }

      function makeAction(name, label, onClick, extraClass = "") {
        const button = document.createElement("button");
        button.className = `item-button ${extraClass}`.trim();
        button.type = "button";
        button.title = label;
        button.setAttribute("aria-label", label);
        button.appendChild(makeIcon(name));
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          onClick();
        });
        return button;
      }

      function render() {
        const history = document.getElementById("history");
        const query = document.getElementById("search-input").value.trim().toLowerCase();
        const filtered = items
          .filter((item) => (historyView === "pinned" ? item.pinned : true))
          .filter((item) => item.text.toLowerCase().includes(query))
          .sort((a, b) => b.createdAt - a.createdAt);
        history.replaceChildren();

        if (filtered.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = "<div class=\"empty-icon\"></div><div class=\"empty-title\"></div><div class=\"empty-copy\"></div>";
          empty.querySelector(".empty-icon").appendChild(makeIcon(query ? "search_off" : historyView === "pinned" ? "push_pin" : "content_paste"));
          empty.querySelector(".empty-title").textContent = query
            ? "No matching items"
            : historyView === "pinned" ? "No pinned clips" : "Your clipboard is ready";
          empty.querySelector(".empty-copy").textContent = query
            ? "Try a different search."
            : historyView === "pinned"
              ? "Pin an item to see it here."
              : "Copy text anywhere while Ghost Writer is running and it will appear here.";
          history.appendChild(empty);
        } else {
          const timeline = document.createElement("div");
          timeline.className = "timeline";
          let currentGroup = null;

          filtered.forEach((item) => {
            const groupLabel = historyGroupLabel(item.createdAt);
            if (!currentGroup || currentGroup.label !== groupLabel) {
              currentGroup = {
                label: groupLabel,
                items: document.createElement("div"),
              };
              const group = document.createElement("section");
              group.className = "timeline-group";

              const heading = document.createElement("div");
              heading.className = "timeline-heading";
              const headingDot = document.createElement("span");
              headingDot.className = "timeline-dot";
              heading.append(headingDot, document.createTextNode(groupLabel));

              currentGroup.items.className = "timeline-items";
              group.append(heading, currentGroup.items);
              timeline.appendChild(group);
            }

            const card = document.createElement("article");
            card.className = `clip-item${item.pinned ? " pinned" : ""}${item.id === activeItemId ? " selected" : ""}`;
            card.title = "Copy this item";
            card.addEventListener("click", () => copyItem(item));

            const main = document.createElement("div");
            main.className = "clip-main";
            const text = document.createElement("div");
            text.className = "clip-text";
            text.textContent = item.text;
            if (item.text.startsWith("data:image/png;base64,")) {
              text.textContent = "";
              const preview = document.createElement("img");
              preview.src = item.text;
              preview.alt = "Clipboard image";
              preview.style.cssText = "max-width:100%;max-height:150px;object-fit:contain";
              text.appendChild(preview);
            }
            const meta = document.createElement("div");
            meta.className = "clip-meta";
            meta.textContent = `${formatTime(item.createdAt)} · ${formatLength(item.text)}`;
            main.append(text, meta);

            const actions = document.createElement("div");
            actions.className = "item-actions";
            actions.appendChild(makeAction("content_copy", "Copy", () => copyItem(item)));
            actions.appendChild(makeAction(
              "push_pin",
              item.pinned ? "Unpin" : "Pin",
              () => togglePin(item),
              item.pinned ? "pin-active" : "",
            ));
            actions.appendChild(makeAction("delete", "Delete", () => deleteItem(item), "danger"));
            card.append(main, actions);
            currentGroup.items.appendChild(card);
          });

          history.appendChild(timeline);
        }

        const visibleLabel = filtered.length === 1 ? "item" : "items";
        const statusSuffix = query && historyView === "all" ? ` · ${items.length} total` : "";
        document.getElementById("status").textContent = `${filtered.length} ${visibleLabel}${statusSuffix}`;
      }

      async function readClipboard(force = false) {
        if (!force && !clipboardSettings.autoCapture) return;
        if (pollInFlight) return;
        pollInFlight = true;
        try {
          const text = await invoke("read_clipboard_text");
          if (typeof text === "string" && text.trim() && text !== lastClipboard) {
            lastClipboard = text;
            addItem(text);
          }
        } catch (error) {
          console.debug("Clipboard read unavailable", error);
        } finally {
          pollInFlight = false;
        }
      }

      async function copyItem(item) {
        activeItemId = item.id;
        render();
        try {
          if (item.text.startsWith("data:image/png;base64,")) {
            await invoke("copy_image_to_clipboard", { base64Png: item.text });
          } else {
            await invoke("write_to_clipboard", { text: item.text });
          }
          lastClipboard = item.text;
          showToast("Copied to clipboard");
        } catch (error) {
          showToast("Could not access the clipboard");
          console.error(error);
        }
      }

      function togglePin(item) {
        item.pinned = !item.pinned;
        sortItems();
        saveItems();
        render();
      }

      function deleteItem(item) {
        items = items.filter((candidate) => candidate.id !== item.id);
        if (activeItemId === item.id) activeItemId = null;
        saveItems();
        render();
        showToast("Clipboard item deleted");
      }

      async function closeWindow() {
        try {
          await invoke("close_clipboard_window");
        } catch (error) {
          console.error(error);
        }
      }

      function clearHistoryFromSettings() {
        items = [];
        activeItemId = null;
        saveItems();
        render();
      }

      function applySettingsFromMain(settings) {
        clipboardSettings = { ...clipboardSettings, ...settings };
        trimItems();
        saveItems();
        render();
      }

      function handleClipboardCommand(event) {
        const command = event?.payload;
        if (command === "refresh") {
          loadItems();
          render();
          return;
        }
        if (command === "clear") {
          clearHistoryFromSettings();
          return;
        }
        if (typeof command !== "string") return;
        try {
          const parsed = JSON.parse(command);
          if (parsed?.type === "settings" && parsed.settings) {
            applySettingsFromMain(parsed.settings);
          }
        } catch (_) {}
      }

      document.getElementById("search-input").addEventListener("input", render);
      document.getElementById("close-button").addEventListener("click", closeWindow);
      document.querySelectorAll("[data-history-view]").forEach((button) => {
        button.addEventListener("click", () => setHistoryView(button.dataset.historyView));
      });

      const currentWindow = window.__TAURI__?.window?.getCurrentWindow?.();
      function startWindowDrag(event) {
        if (event.button !== 0 || event.target.closest("button, input, label")) return;
        const dragResult = currentWindow?.startDragging?.();
        if (dragResult && typeof dragResult.catch === "function") {
          dragResult.catch(() => {});
        }
      }
      document.querySelectorAll(".window-drag, .header").forEach((region) => {
        region.addEventListener("mousedown", startWindowDrag);
      });

      listen("clipboard-command", handleClipboardCommand).catch((error) => {
        console.debug("Clipboard settings listener unavailable", error);
      });

      loadItems();
      render();
      window.addEventListener("storage", (event) => {
        if (event.key === HISTORY_KEY) { loadItems(); render(); }
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) { loadItems(); render(); }
      });
    </script>
  </body>
</html>
